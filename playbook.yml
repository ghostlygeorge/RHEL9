- name: RHEL9 CIS hardening (via the RHEL9-CIS role)
  hosts: all
  become: yes

  vars:
    # Ships with a known-public GRUB password hash - leave false unless
    # you supply your own via rhel9cis_bootloader_password_hash.
    rhel9cis_rule_1_4_1: false

    # Placeholder banner - replace with your own organization's notice.
    ssh_banner_text: |
      ------------------------------------------------------------------------
       AUTHORISED ACCESS ONLY
       This system is the property of <ORGANIZATION NAME>. All connections,
       commands and file transfers may be logged and monitored. Unauthorised
       access or use is prohibited. Disconnect now if you are not an
       authorised user.
      ------------------------------------------------------------------------

    # Place the matching installer alongside this playbook under these
    # filenames (or override the vars) before running.
    falcon_sensor_arch: "{{ falcon_sensor_arch | default('x86_64') }}"
    falcon_sensor_local_path: "{{ playbook_dir }}/falcon-sensor-latest.rhel9.{{ falcon_sensor_arch | default('x86_64') }}.rpm"
    cimtrak_installer_local_path: "{{ playbook_dir }}/cimtrak-agent-installer.run"

  roles:
    # ignore_errors here applies to every task in the role, so a single
    # failed remediation doesn't halt the rest of the CIS hardening run.
    - role: ./RHEL9-CIS
      ignore_errors: true

  tasks:
    ####################################################################
    # CrowdStrike Falcon - installed and left dormant; activation
    # (registering with the Falcon CID) happens post-launch.
    ####################################################################

    - name: Copy Falcon agent to the remote host
      ansible.builtin.copy:
        src: "{{ falcon_sensor_local_path }}"
        dest: "/tmp/{{ falcon_sensor_local_path | basename }}"
        mode: '0644'

    - name: Install Falcon agent
      ansible.builtin.yum:
        name: "/tmp/{{ falcon_sensor_local_path | basename }}"
        state: present
        disable_gpg_check: yes

    - name: Stop Falcon service if running
      ansible.builtin.systemd:
        name: falcon-sensor
        state: stopped
      ignore_errors: true

    - name: Clear Falcon local state
      ansible.builtin.file:
        path: /opt/CrowdStrike/var/
        state: absent

    - name: Recreate Falcon var directory
      ansible.builtin.file:
        path: /opt/CrowdStrike/var/
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Ensure Falcon service is disabled
      ansible.builtin.systemd:
        name: falcon-sensor
        enabled: false

    - name: Delete Falcon agent installer
      ansible.builtin.file:
        path: "/tmp/{{ falcon_sensor_local_path | basename }}"
        state: absent

    ####################################################################
    # CimTrak FIM - same copy -> install -> dormant pattern as Falcon.
    # Activation (pointing it at the CimTrak master server) happens
    # post-launch.
    ####################################################################

    - name: Copy CimTrak installer to the remote host
      ansible.builtin.copy:
        src: "{{ cimtrak_installer_local_path }}"
        dest: "/tmp/{{ cimtrak_installer_local_path | basename }}"
        mode: '0755'

    - name: Run CimTrak installer
      # Fill in the real silent-install flags for your installer build
      # (master server host/port, install dir) before using this.
      ansible.builtin.command: "/tmp/{{ cimtrak_installer_local_path | basename }} --silent"
      args:
        creates: /opt/cimtrak  # adjust to CimTrak's real install path

    - name: Stop CimTrak service if running
      ansible.builtin.systemd:
        name: cimtrakagent
        state: stopped
      ignore_errors: true

    - name: Ensure CimTrak service is disabled
      ansible.builtin.systemd:
        name: cimtrakagent
        enabled: false

    - name: Delete CimTrak installer
      ansible.builtin.file:
        path: "/tmp/{{ cimtrak_installer_local_path | basename }}"
        state: absent

    - name: Set SSH banner
      ansible.builtin.copy:
        dest: /etc/issue.net
        content: "{{ ssh_banner_text }}"

    ####################################################################
    # Agent removal - opt-in only, does not run on a normal playbook
    # run. Invoke explicitly with:
    #   ansible-playbook playbook.yml --tags remove_agents
    ####################################################################

    - name: Stop Falcon service before removal
      ansible.builtin.systemd:
        name: falcon-sensor
        state: stopped
      ignore_errors: true
      tags: [never, remove_agents]

    - name: Uninstall Falcon agent
      ansible.builtin.yum:
        name: falcon-sensor
        state: absent
      tags: [never, remove_agents]

    - name: Remove leftover Falcon directory
      ansible.builtin.file:
        path: /opt/CrowdStrike
        state: absent
      tags: [never, remove_agents]

    - name: Stop CimTrak service before removal
      ansible.builtin.systemd:
        name: cimtrakagent
        state: stopped
      ignore_errors: true
      tags: [never, remove_agents]

    - name: Uninstall CimTrak agent
      # Fill in the real uninstall command for your installer build
      # (e.g. a bundled /opt/cimtrak/uninstall.sh) - not something to
      # guess at.
      ansible.builtin.command: /opt/cimtrak/uninstall.sh --silent
      args:
        removes: /opt/cimtrak
      tags: [never, remove_agents]

    - name: Remove leftover CimTrak directory
      ansible.builtin.file:
        path: /opt/cimtrak
        state: absent
      tags: [never, remove_agents]
